<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- CSP (defense-in-depth behind per-sink HTML escaping): the live feeds + operator-pasted image
       URLs stay open (https:/wss:/data:/blob:), MapLibre+three keep their blob web-workers and the
       inline boot scripts run — but an injected remote <script src>, <object>/<embed>, <base> hijack,
       cross-origin form post, or http: mixed-content load is blocked. frame-ancestors needs an HTTP
       header (GitHub Pages can't set one), so clickjacking defense is out of scope for a meta CSP. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: blob: data:; worker-src blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <!-- never let the browser serve a stale cached HTML entry (which would load old ?v JS and flash
       an old version / revert styles via pre-authoritative sync); always revalidate the page -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Al Jazeera — News Map · Control</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="../lib/leaflet.min.css">
  <link rel="stylesheet" href="lib/maplibre-gl.css">
  <link rel="stylesheet" href="css/tokens.css?v=71">
  <link rel="stylesheet" href="css/app.css?v=71">
  <link rel="stylesheet" href="css/control.css?v=71">
  <style>/* boot veil — hides the default→saved style/view swap on load (no FOUC / "old version" flash) */
    #boot{position:fixed;inset:0;background:#0a0e16;z-index:100000;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease}
    #boot.gone{opacity:0;pointer-events:none}
    #boot::after{content:'';width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.16);border-top-color:rgba(255,255,255,.7);animation:bootspin .8s linear infinite}
    @keyframes bootspin{to{transform:rotate(360deg)}}</style>
</head>
<body>
  <div id="boot" aria-hidden="true"></div>
  <svg style="position:absolute;width:0;height:0" aria-hidden="true">
    <filter id="glassDistort" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.016" numOctaves="2" seed="11" result="n"/>
      <feGaussianBlur in="n" stdDeviation="0.5" result="nb"/>
      <feDisplacementMap id="glassDisp" in="SourceGraphic" in2="nb" scale="22" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div id="map"></div>

  <script>window.APP_ROLE = 'control';</script>
  <script src="../lib/leaflet.min.js"></script>
  <script src="lib/maplibre-gl.min.js"></script>
  <!-- util.js MUST stay the first project script (before icons.js and everything after it): every
       module opens its IIFE with `const {…} = window.U`, which throws at LOAD if U is not there yet.
       It is non-defer on purpose, so it also precedes every `defer` module further down. -->
  <script src="js/util.js?v=71"></script>
  <script src="js/icons.js?v=71"></script>
  <script src="js/help.js?v=71"></script>
  <script src="js/lbar.js?v=71"></script>
  <script src="js/theme.js?v=71"></script>
  <script src="js/map.js?v=71"></script>
  <script src="js/store.js?v=71"></script>
  <script src="js/sync-client.js?v=71"></script>
  <script>/* idempotent lazy loader — keeps heavy on-demand libs (html2canvas 194KB, searoute 484KB) off the boot path; used by ui.js export + tracking.js routes */
    window.loadScript = window.loadScript || (function () { const cache = {}; return src => cache[src] || (cache[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete cache[src]; rej(new Error('load failed: ' + src)); }; document.head.appendChild(s); })); })();</script>
  <script src="data/countries.js"></script>
  <script src="data/flags.js"></script>
  <script src="js/ui.js?v=71"></script>
  <script src="js/draw.js?v=71"></script>
  <script src="js/app.js?v=71"></script>
  <script src="js/map-style.js?v=71"></script>
  <script src="js/locator.js?v=71"></script>
  <script src="js/scene-inspector.js?v=71"></script>
  <script src="js/geocode.js?v=71"></script>
  <script src="js/campath.js?v=71"></script>
  <script src="data/ports.js"></script>
  <script src="js/ports-lookup.js?v=71"></script>
  <script src="js/tracking.js?v=71"></script>
  <script src="js/overlays.js?v=71"></script>
  <script src="js/map3d.js?v=71"></script>
  <script src="lib/three.min.js" defer></script>
  <script src="lib/GLTFLoader.js" defer></script>
  <script src="lib/DRACOLoader.js" defer></script>
  <script src="data/models3d-catalog.js"></script>
  <script src="js/assets3d.js?v=71"></script>
  <script src="js/models3d-geo.js?v=71" defer></script>
  <script src="js/models3d.js?v=71" defer></script>
  <script src="js/models-anim.js?v=71" defer></script>
  <script src="js/follow.js?v=71"></script>
  <script src="js/tracking3d.js?v=71" defer></script>
  <script src="js/model-control.js?v=71"></script>
  <script src="js/timeline.js?v=71"></script>
  <script src="js/fx.js?v=71"></script>
  <script src="js/seafx.js?v=71"></script>
  <script src="js/daynight.js?v=71"></script>
  <script src="js/chrome.js?v=71"></script>
  <script src="js/qbar.js?v=71"></script>
  <script src="js/movable.js?v=71"></script>
  <script src="js/config-apply.js?v=71"></script>
  <script src="js/cfg-kit.js?v=71"></script>
  <!-- cfg-tabs-*.js only DEFINE window.CfgTabsA/B factories at load time; config-panel.js
       INVOKES them, so they must load before it (and after cfg-kit.js is irrelevant to them
       — they take every helper through the ctx object config-panel.js passes in). -->
  <script src="js/cfg-tabs-a.js?v=71"></script>
  <script src="js/cfg-tabs-b.js?v=71"></script>
  <script src="js/config-panel.js?v=71"></script>
  <script>/* all modules have run + applied the saved config; fade the boot veil */
    (function(){var v=document.getElementById('boot');if(!v)return;var fade=function(){v.classList.add('gone');setTimeout(function(){if(v.parentNode)v.remove();},500);};
      requestAnimationFrame(function(){setTimeout(fade,650);});setTimeout(fade,3500);})();</script>
</body>
</html>
