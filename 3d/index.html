<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rock Garden — نموذج ثلاثي الأبعاد</title>
<style>
  :root{
    --glass: rgba(18,22,26,.55);
    --glass-brd: rgba(255,255,255,.10);
    --accent: #00d4ee;
    --txt: #eef3f6;
    --txt-dim: rgba(238,243,246,.62);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#0a0f14;color:var(--txt);
    font-family:-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;overflow:hidden}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #scene:active{cursor:grabbing}

  /* ---------- title ---------- */
  #title{position:fixed;top:22px;inset-inline-start:26px;z-index:5;pointer-events:none}
  #title h1{margin:0;font-size:20px;font-weight:650;letter-spacing:.2px}
  #title p{margin:4px 0 0;font-size:12.5px;color:var(--txt-dim)}

  /* ---------- glass panel ---------- */
  #panel{
    position:fixed;top:22px;inset-inline-end:22px;z-index:6;width:268px;
    background:var(--glass);backdrop-filter:blur(40px) saturate(140%);
    -webkit-backdrop-filter:blur(40px) saturate(140%);
    border:1px solid var(--glass-brd);border-radius:16px;padding:14px 15px 16px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);transition:transform .28s ease,opacity .2s ease
  }
  #panel.collapsed{transform:translateX(calc(100% + 34px));opacity:0}
  #panelToggle{
    position:fixed;top:22px;inset-inline-end:22px;z-index:7;width:46px;height:46px;
    display:grid;place-items:center;border-radius:13px;cursor:pointer;
    background:var(--glass);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
    border:1px solid var(--glass-brd);color:var(--txt);opacity:0;pointer-events:none;transition:opacity .2s
  }
  #panel.collapsed ~ #panelToggle{opacity:1;pointer-events:auto}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .panel-head h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.3px}
  .x{width:26px;height:26px;border-radius:8px;border:1px solid var(--glass-brd);
     background:rgba(255,255,255,.05);color:var(--txt);cursor:pointer;line-height:1;font-size:13px}

  .row{margin:11px 0}
  .row label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--txt-dim);margin-bottom:6px}
  .row label b{color:var(--accent);font-weight:600}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:3px;
    background:rgba(255,255,255,.14);outline:none
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 4px rgba(0,212,238,.16);cursor:pointer
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:0;border-radius:50%;background:var(--accent);cursor:pointer
  }

  .btns{display:flex;gap:7px;margin-top:6px;flex-wrap:wrap}
  .btn{
    flex:1 1 auto;min-height:32px;padding:0 10px;border-radius:10px;cursor:pointer;
    border:1px solid var(--glass-brd);background:rgba(255,255,255,.05);color:var(--txt);
    font-size:11.5px;font-family:inherit;transition:background .15s,border-color .15s
  }
  .btn:hover{background:rgba(255,255,255,.10)}
  .btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,212,238,.10)}
  .swatch{display:inline-flex;gap:3px;vertical-align:middle;margin-inline-end:5px}
  .swatch i{width:7px;height:7px;border-radius:50%;display:block}

  .divider{height:1px;background:var(--glass-brd);margin:13px 0 4px}

  /* ---------- footer readout ---------- */
  #hud{
    position:fixed;bottom:20px;inset-inline-start:26px;z-index:5;display:flex;gap:16px;align-items:center;
    font-size:11.5px;color:var(--txt-dim)
  }
  #hud b{color:var(--txt);font-weight:600}
  #stats{display:flex;gap:14px}
  #hint{
    position:fixed;bottom:20px;inset-inline-end:26px;z-index:5;font-size:11.5px;color:var(--txt-dim)
  }
  @media (max-width:720px){
    #panel{width:calc(100% - 44px);top:78px}
    #panelToggle{top:78px}
    #title h1{font-size:17px}
    #hint{display:none}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="title">
  <h1>حديقة الصخرة</h1>
  <p>نموذج WebGL تجريبي — صخرة إجرائية تنمو عليها الأعشاب والزهور</p>
</div>

<div id="panel">
  <div class="panel-head">
    <h2>لوحة التحكم</h2>
    <button class="x" id="closePanel" title="طيّ اللوحة">✕</button>
  </div>

  <div class="row">
    <label>كثافة الأعشاب <b id="grassVal">16,000</b></label>
    <input type="range" id="grassRange" min="2000" max="70000" step="1000" value="16000">
  </div>

  <div class="row">
    <label>عدد الزهور <b id="flowerVal">700</b></label>
    <input type="range" id="flowerRange" min="0" max="4000" step="50" value="700">
  </div>

  <div class="row">
    <label>قوة الرياح <b id="windVal">100%</b></label>
    <input type="range" id="windRange" min="0" max="250" step="5" value="100">
  </div>

  <div class="row">
    <label>وقت اليوم <b id="todVal">فجر</b></label>
    <input type="range" id="todRange" min="0" max="100" step="1" value="35">
  </div>

  <div class="divider"></div>

  <div class="row">
    <label>لوحة ألوان الزهور</label>
    <div class="btns">
      <button class="btn active" data-palette="warm">
        <span class="swatch"><i style="background:#f2b93c"></i><i style="background:#ef6d3a"></i><i style="background:#e8467a"></i></span>دافئة
      </button>
      <button class="btn" data-palette="cool">
        <span class="swatch"><i style="background:#74b7ec"></i><i style="background:#5a86e0"></i><i style="background:#9c6fe0"></i></span>باردة
      </button>
      <button class="btn" data-palette="aj">
        <span class="swatch"><i style="background:#e8b53f"></i><i style="background:#db8a3a"></i><i style="background:#c0392b"></i></span>ذهبية
      </button>
    </div>
  </div>

  <div class="btns">
    <button class="btn active" id="rotBtn">إيقاف الدوران</button>
    <button class="btn" id="shotBtn">حفظ صورة PNG</button>
  </div>
</div>
<button id="panelToggle" title="إظهار اللوحة">☰</button>

<div id="hud">
  <span id="fps">— fps</span>
  <span id="stats"></span>
  <span id="status"></span>
</div>
<div id="hint">اسحب للدوران · عجلة الفأرة للتقريب</div>

<script src="../v2/lib/three.min.js"></script>
<script src="../v2/lib/GLTFLoader.js"></script>
<script src="./js/noise.js"></script>
<script src="./js/rock-garden.js"></script>
<script>
  document.getElementById('closePanel').addEventListener('click', function () {
    document.getElementById('panel').classList.add('collapsed');
  });
  document.getElementById('panelToggle').addEventListener('click', function () {
    document.getElementById('panel').classList.remove('collapsed');
  });
</script>
</body>
</html>
